<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>Estoque de TI – Madeireira Brotas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #fffaeb;
      --card: #fff;
      --tx: #14213d;
      --mut: #6a6350;
      --bd: #ead9a6;
      --ac: #1b3f94;
      --acx: #fff;
      --red: #d9232d;
      --gold: #ffc502;
      --ok: #1f7a4a;
      --warn: #b86e00;
      --bad: #b3392f
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1a33;
        --card: #17254a;
        --tx: #eef2fb;
        --mut: #9fb0d3;
        --bd: #2a3c6b;
        --ac: #ffc502;
        --acx: #0f1a33;
        --red: #ef5b63;
        --gold: #ffc502;
        --ok: #5cc08a;
        --warn: #e3a33b;
        --bad: #ef7b70
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f1a33;
      --card: #17254a;
      --tx: #eef2fb;
      --mut: #9fb0d3;
      --bd: #2a3c6b;
      --ac: #ffc502;
      --acx: #0f1a33;
      --red: #ef5b63;
      --gold: #ffc502;
      --ok: #5cc08a;
      --warn: #e3a33b;
      --bad: #ef7b70
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px
    }

    h1 {
      font-size: 20px;
      margin: 0;
      color: var(--ac)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .logo {
      background: none;
      padding: 0;
      border: 0
    }

    .logo img {
      height: 92px;
      width: 92px;
      display: block
    }

    @media(max-width:480px) {
      .logo img {
        height: 70px;
        width: 70px
      }

      h1 {
        font-size: 17px
      }
    }

    .sub {
      color: var(--mut);
      font-size: 13px
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      border-radius: 8px;
      padding: 7px 12px
    }

    button.p {
      background: var(--ac);
      color: var(--acx);
      border-color: var(--ac);
      font-weight: 600
    }

    button.s {
      padding: 4px 9px;
      font-size: 13px
    }

    input,
    select,
    textarea {
      font: inherit;
      width: 100%;
      padding: 8px;
      border: 1px solid var(--bd);
      border-radius: 8px;
      background: var(--card);
      color: var(--tx)
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      margin-bottom: 12px
    }

    .st {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer
    }

    .st.on {
      outline: 2px solid var(--ac);
      border-top: 4px solid var(--red)
    }

    .st b {
      font-size: 22px;
      display: block
    }

    .bar {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px
    }

    @media(max-width:600px) {
      .bar {
        grid-template-columns: 1fr
      }
    }

    .list {
      display: grid;
      gap: 8px
    }

    .it {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      flex-wrap: wrap
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      padding: 1px 8px;
      border-radius: 99px;
      border: 1px solid var(--bd);
      color: var(--mut);
      margin-right: 4px
    }

    .q {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      min-width: 70px
    }

    .q small {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: var(--mut)
    }

    .act {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center
    }

    .loan {
      font-size: 13px;
      color: var(--warn);
      margin-top: 4px
    }

    .ov {
      position: fixed;
      inset: 0;
      background: #0008;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9
    }

    .md {
      background: var(--bg);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 440px;
      max-height: 90%;
      overflow: auto;
      display: grid;
      gap: 8px
    }

    label {
      font-size: 13px;
      color: var(--mut)
    }

    .empty {
      text-align: center;
      color: var(--mut);
      padding: 30px
    }

    footer {
      margin-top: 28px;
      padding: 14px 0 8px;
      border-top: 1px solid var(--bd);
      text-align: center;
      color: var(--mut);
      font-size: 12.5px
    }

    footer b {
      color: var(--tx)
    }

    #who {
      margin-top: 4px
    }

    header {
      border-bottom: 5px solid var(--gold);
      padding-bottom: 12px;
      margin-bottom: 16px
    }

    .note {
      background: var(--card);
      border: 1px dashed var(--warn);
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      margin-bottom: 10px
    }
  </style>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#1b3f94">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Estoque TI">
</head>

<body>
  <main>
    <header>
      <div class="brand">
        <div class="logo"><img src="/logo.png" alt="IS DevWorks"></div>
        <div>
          <h1>Estoque de TI</h1>
          <div class="sub">Peças sobressalentes · IS DevWorks</div>
        </div>
      </div>
      <div class="act"><button id="bu">Unidades</button><button id="bus" style="display:none">Usuários</button><button
          class="p" id="bn">+ Nova peça</button><button id="bo">Sair</button></div>
    </header>
    <div id="note"></div>
    <div class="stats" id="stats"></div>
    <div class="bar"><input id="q" placeholder="Buscar peça, modelo, local…"><select id="fc"></select><select id="fs">
        <option value="">Todas</option>
        <option value="disp">Disponíveis</option>
        <option value="emp">Emprestadas</option>
        <option value="zero">Sem estoque</option>
      </select></div>
    <div class="list" id="list"></div>
    <div id="modal"></div>
    <footer id="rod">Desenvolvido por <b>Ícaro Souza</b> · <b>IsDevWorks</b><br>© <span id="yr">2026</span> Todos os
      direitos reservados<div id="who"></div><button class="s" id="bsn" style="margin-top:6px">Alterar minha
        senha</button></footer>
  </main>
  <script>
    const CATS = ["Memória RAM", "HD/SSD", "Fonte", "Placa-mãe", "Monitor", "Teclado/Mouse", "Cabo/Conector", "Switch/Roteador", "Impressora/Toner", "Nobreak/Bateria", "Computador completo", "Outros"];
    let units = ["Madeireira Brotas Matriz", "Madeireira Brotas Cajazeiras", "Madeireira Brotas Imbui", "Madeireira Brotas Lisboa", "Madeireira Brotas Itapoan", "Madeireira Brotas Angra", "Madeireira Brotas Camaçari", "Madeireira Brotas Imecol", "Madeireira Brotas San Martim", "Madeireira Brotas Vinhais"], parts = [], db = null, fu = "";
    const $ = id => document.getElementById(id), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const out = p => (p.emp || []).reduce((a, e) => a + e.qtd, 0), av = p => p.qtd - out(p);
    const api = (m, u, b) => fetch(u, { method: m, headers: { "Content-Type": "application/json" }, body: b ? JSON.stringify(b) : undefined }).then(r => { if (r.status == 401) { location.replace("/login.html"); throw new Error(401) } if (!r.ok) throw new Error(r.status); return r.json() });
    const erro = m => { $("note").innerHTML = m ? `<div class="note">${m}</div>` : "" };
    async function load() { try { const d = await api("GET", "/api/dados"); parts = d.pecas; if (d.unidades && d.unidades.length) units = d.unidades; erro(""); render() } catch (e) { erro("Sem conexão com o servidor. Tentando de novo…") } }
    function save(p) { const i = parts.findIndex(x => x.id == p.id); i < 0 ? parts.push(p) : parts[i] = p; render(); api("PUT", "/api/pecas/" + encodeURIComponent(p.id), p).catch(() => { erro("Não foi possível salvar. Verifique a conexão."); load() }) }
    function del(id) { parts = parts.filter(x => x.id != id); render(); api("DELETE", "/api/pecas/" + encodeURIComponent(id)).catch(() => { erro("Não foi possível excluir."); load() }) }
    function saveUnits() { render(); api("PUT", "/api/unidades", { lista: units }).catch(() => erro("Não foi possível salvar as unidades.")) }
    function render() {
      const qs = $("q").value.toLowerCase(), fc = $("fc").value, fs = $("fs").value;
      $("fc").innerHTML = '<option value="">Todas as categorias</option>' + CATS.map(c => `<option ${c == fc ? "selected" : ""}>${c}</option>`).join("");
      $("stats").innerHTML = `<div class="st ${fu ? "" : "on"}" data-u=""><span class="sub">Todas as unidades</span><b>${parts.reduce((a, p) => a + p.qtd, 0)}</b><span class="sub">${parts.length} tipos de peça</span></div>` + units.map(u => { const l = parts.filter(p => p.emp_ === undefined && p.un == u); return `<div class="st ${fu == u ? "on" : ""}" data-u="${esc(u)}"><span class="sub">${esc(u)}</span><b>${l.reduce((a, p) => a + p.qtd, 0)}</b><span class="sub">${l.length} tipos de peça</span></div>` }).join("");
      document.querySelectorAll(".st").forEach(e => e.onclick = () => { fu = e.dataset.u; render() });
      const l = parts.filter(p => (!fu || p.un == fu) && (!fc || p.cat == fc) && (!qs || [p.nome, p.mod, p.loc, p.obs, p.cat].join(" ").toLowerCase().includes(qs)) && (!fs || (fs == "disp" && av(p) > 0) || (fs == "emp" && out(p) > 0) || (fs == "zero" && av(p) <= 0))).sort((a, b) => a.nome.localeCompare(b.nome));
      $("list").innerHTML = l.length ? l.map(p => `<div class="it"><div style="flex:1;min-width:200px"><b>${esc(p.nome)}</b> ${p.mod ? `<span class="sub">${esc(p.mod)}</span>` : ""}<div><span class="tag">${esc(p.un)}</span><span class="tag">${esc(p.cat)}</span><span class="tag">${esc(p.est)}</span>${p.loc ? `<span class="tag">📍 ${esc(p.loc)}</span>` : ""}</div>${p.obs ? `<div class="sub">${esc(p.obs)}</div>` : ""}${(p.emp || []).map((e, i) => `<div class="loan">↪ ${e.qtd}× emprestada para <b>${esc(e.para)}</b> (${esc(e.data)}) <button class="s" data-r="${p.id}|${i}">Devolver</button></div>`).join("")}</div>
 <div class="q" style="color:${av(p) > 0 ? "var(--ok)" : "var(--bad)"}">${av(p)}<small>disponível${out(p) ? ` de ${p.qtd}` : ""}</small></div>
 <div class="act"><button class="s" data-a="-|${p.id}">−</button><button class="s" data-a="+|${p.id}">+</button><button class="s" data-l="${p.id}" ${av(p) > 0 ? "" : "disabled"}>Emprestar</button><button class="s" data-e="${p.id}">Editar</button></div></div>`).join("") : `<div class="empty">Nenhuma peça encontrada.</div>`;
      const g = id => parts.find(p => p.id == id);
      document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { const [s, id] = b.dataset.a.split("|"), p = g(id); p.qtd = Math.max(out(p), p.qtd + (s == "+" ? 1 : -1)); save(p) });
      document.querySelectorAll("[data-e]").forEach(b => b.onclick = () => form(g(b.dataset.e)));
      document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => loan(g(b.dataset.l)));
      document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { const [id, i] = b.dataset.r.split("|"), p = g(id); p.emp.splice(+i, 1); save(p) });
    }
    function modal(h) { $("modal").innerHTML = `<div class="ov"><div class="md">${h}</div></div>` }
    function close() { $("modal").innerHTML = "" }
    const opts = (a, v) => a.map(x => `<option ${x == v ? "selected" : ""}>${esc(x)}</option>`).join("");
    function form(p) {
      const n = !p; p = p || { un: units[0], cat: CATS[0], est: "Novo", qtd: 1, nome: "", mod: "", loc: "", obs: "" };
      modal(`<b>${n ? "Nova peça" : "Editar peça"}</b><label>Unidade</label><select id="fu">${opts(units, p.un)}</select><label>Peça</label><input id="fn" value="${esc(p.nome)}" placeholder="Ex.: Memória DDR4 8GB"><label>Modelo / marca</label><input id="fm" value="${esc(p.mod)}"><label>Categoria</label><select id="fcat">${opts(CATS, p.cat)}</select><label>Quantidade</label><input id="fq" type="number" min="0" value="${p.qtd}"><label>Estado</label><select id="fe">${opts(["Novo", "Usado – bom", "Usado – testar", "Com defeito"], p.est)}</select><label>Local guardado</label><input id="fl" value="${esc(p.loc)}" placeholder="Ex.: Armário do TI"><label>Observações</label><textarea id="fo" rows="2">${esc(p.obs)}</textarea>
 <div class="act"><button class="p" id="ok">Salvar</button><button id="cx">Cancelar</button>${n ? "" : '<button id="dl" style="color:var(--bad)">Excluir</button>'}</div>`);
      $("cx").onclick = close; if (!n) $("dl").onclick = () => { if ($("dl").dataset.c) { del(p.id); close() } else { $("dl").dataset.c = 1; $("dl").textContent = "Confirmar exclusão" } };
      $("ok").onclick = () => {
        const nome = $("fn").value.trim(); if (!nome) return $("fn").focus();
        save({ ...p, id: p.id || "p" + Date.now(), un: $("fu").value, nome, mod: $("fm").value.trim(), cat: $("fcat").value, qtd: Math.max(out(p), +$("fq").value || 0), est: $("fe").value, loc: $("fl").value.trim(), obs: $("fo").value.trim(), emp: p.emp || [] }); close()
      }
    }
    function loan(p) {
      const o = units.filter(u => u != p.un);
      modal(`<b>Emprestar: ${esc(p.nome)}</b><div class="sub">Disponível: ${av(p)}</div><label>Para a unidade</label><select id="lp">${opts(o, "")}</select><label>Quantidade</label><input id="lq" type="number" min="1" max="${av(p)}" value="1"><div class="act"><button class="p" id="ok">Registrar empréstimo</button><button id="cx">Cancelar</button></div>`);
      $("cx").onclick = close; $("ok").onclick = () => { const q = Math.min(av(p), Math.max(1, +$("lq").value || 1)); p.emp = [...(p.emp || []), { para: $("lp").value, qtd: q, data: new Date().toLocaleDateString("pt-BR") }]; save(p); close() }
    }
    function unitsModal() {
      modal(`<b>Unidades do grupo</b><div class="sub">Uma por linha. Ao renomear, ajuste as peças existentes.</div><textarea id="ut" rows="8">${esc(units.join("\n"))}</textarea><div class="act"><button class="p" id="ok">Salvar</button><button id="cx">Cancelar</button></div>`);
      $("cx").onclick = close; $("ok").onclick = () => { const l = $("ut").value.split("\n").map(s => s.trim()).filter(Boolean); if (l.length > 1) { units = [...new Set(l)]; saveUnits() } close() }
    }
    let eu = {};
    async function apiE(m, u, b) { const r = await fetch(u, { method: m, headers: { "Content-Type": "application/json" }, body: b ? JSON.stringify(b) : undefined }); if (r.status == 401) { location.replace("/login.html"); throw new Error("Sessão expirada") } const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.erro || "Erro " + r.status); return d }
    function aviso(id, t, ok) { const e = $(id); e.textContent = t; e.style.display = "block"; e.style.borderColor = ok ? "var(--ok)" : "var(--bad)" }
    async function usersModal() {
      let l; try { l = await apiE("GET", "/api/usuarios") } catch (e) { return erro(esc(e.message)) }
      modal(`<b>Usuários</b><div class="sub">Quem pode entrar no sistema</div>` + l.map(u => `<div class="it" style="padding:8px 12px;align-items:center"><div><b>${esc(u.nome)}</b> ${u.admin ? '<span class="tag">Admin</span>' : ""}<div class="sub">${esc(u.usuario)}</div></div><button class="s" data-ue="${u.id}">Editar</button></div>`).join("") + `<div class="act"><button class="p" id="un">+ Novo usuário</button><button id="cx">Fechar</button></div>`);
      $("cx").onclick = close; $("un").onclick = () => userForm(null);
      document.querySelectorAll("[data-ue]").forEach(b => b.onclick = () => userForm(l.find(u => u.id == b.dataset.ue)))
    }
    function userForm(u) {
      const n = !u; u = u || { usuario: "", nome: "", admin: false };
      modal(`<b>${n ? "Novo usuário" : "Editar usuário"}</b><label>Nome</label><input id="fn_" value="${esc(u.nome)}"><label>Usuário (login)</label><input id="fu_" value="${esc(u.usuario)}" ${n ? "" : "disabled"} autocapitalize="none"><label>${n ? "Senha (mínimo 8 caracteres)" : "Nova senha (deixe em branco para manter)"}</label><input id="fs_" type="password" autocomplete="new-password"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fa_" style="width:auto" ${u.admin ? "checked" : ""}> Administrador (gerencia usuários)</label><div class="note" id="fe_" style="display:none"></div><div class="act"><button class="p" id="ok">Salvar</button><button id="cx">Voltar</button>${n || u.id == eu.id ? "" : '<button id="dl" style="color:var(--bad)">Excluir</button>'}</div>`);
      $("cx").onclick = usersModal;
      $("ok").onclick = async () => { const b = { nome: $("fn_").value, usuario: $("fu_").value, senha: $("fs_").value, admin: $("fa_").checked }; try { n ? await apiE("POST", "/api/usuarios", b) : await apiE("PUT", "/api/usuarios/" + u.id, b); usersModal() } catch (e) { aviso("fe_", e.message) } };
      if (!n && u.id != eu.id) $("dl").onclick = async () => { if (!$("dl").dataset.c) { $("dl").dataset.c = 1; return $("dl").textContent = "Confirmar exclusão" } try { await apiE("DELETE", "/api/usuarios/" + u.id); usersModal() } catch (e) { aviso("fe_", e.message) } }
    }
    function senhaModal() {
      modal(`<b>Alterar minha senha</b><label>Senha atual</label><input id="sa_" type="password" autocomplete="current-password"><label>Nova senha (mínimo 8 caracteres)</label><input id="sn_" type="password" autocomplete="new-password"><div class="note" id="se_" style="display:none"></div><div class="act"><button class="p" id="ok">Salvar</button><button id="cx">Fechar</button></div>`);
      $("cx").onclick = close; $("ok").onclick = async () => { try { await apiE("POST", "/api/minha-senha", { atual: $("sa_").value, nova: $("sn_").value }); aviso("se_", "Senha alterada com sucesso.", true); $("ok").disabled = true } catch (e) { aviso("se_", e.message) } }
    }
    $("bn").onclick = () => form(); $("bu").onclick = unitsModal; $("q").oninput = render; $("fc").onchange = render; $("fs").onchange = render;
    render();
    $("yr").textContent = new Date().getFullYear(); $("bo").onclick = async () => { try { await api("POST", "/api/logout") } catch (e) { } location.replace("/login.html") }; api("GET", "/api/me").then(u => { eu = u; $("who").textContent = "Conectado como " + u.nome; if (u.admin) $("bus").style.display = "" }).catch(() => { }); $("bus").onclick = usersModal; $("bsn").onclick = senhaModal; load(); setInterval(load, 20000); if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => { });
  </script>
</body>

</html>
