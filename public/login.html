<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>Entrar – Estoque de TI Brotas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#1b3f94">
    <style>
        :root {
            box-sizing: border-box;
            --bg: #fffaeb;
            --card: #fff;
            --tx: #14213d;
            --mut: #6a6350;
            --bd: #ead9a6;
            --ac: #1b3f94;
            --acx: #fff;
            --gold: #ffc502;
            --bad: #b3392f
        }

        @media (prefers-color-scheme:dark) {
            :root {
                --bg: #0f1a33;
                --card: #17254a;
                --tx: #eef2fb;
                --mut: #9fb0d3;
                --bd: #2a3c6b;
                --ac: #ffc502;
                --acx: #0f1a33;
                --bad: #ef7b70
            }
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(16px, env(safe-area-inset-bottom))
        }

        .box {
            background: var(--card);
            border: 1px solid var(--bd);
            border-top: 4px solid var(--gold);
            border-radius: 14px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            display: grid;
            gap: 10px
        }

        .logo {
            justify-self: center
        }

        .logo img {
            height: 130px;
            width: 130px;
            display: block
        }

        h1 {
            font-size: 19px;
            margin: 6px 0 0;
            text-align: center
        }

        .sub {
            color: var(--mut);
            font-size: 13px;
            text-align: center;
            margin-bottom: 6px
        }

        label {
            font-size: 13px;
            color: var(--mut)
        }

        input {
            font: inherit;
            width: 100%;
            padding: 11px;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: var(--bg);
            color: var(--tx)
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 0;
            border-radius: 8px;
            padding: 11px;
            background: var(--ac);
            color: var(--acx);
            font-weight: 700;
            margin-top: 6px
        }

        button:disabled {
            opacity: .6
        }

        .err {
            color: var(--bad);
            font-size: 13px;
            min-height: 18px;
            text-align: center
        }

        footer {
            margin-top: 18px;
            color: var(--mut);
            font-size: 12.5px;
            text-align: center
        }
    </style>
</head>

<body>
    <form class="box" id="f" autocomplete="on">
        <div class="logo"><img src="/logo.png" alt="IS DevWorks"></div>
        <h1>Estoque de TI</h1>
        <div class="sub">Acesso restrito à equipe de suporte</div>
        <label for="u">Usuário</label><input id="u" name="username" autocomplete="username" autocapitalize="none"
            required>
        <label for="s">Senha</label><input id="s" name="password" type="password" autocomplete="current-password"
            required>
        <div class="err" id="e"></div><button id="b" type="submit">Entrar</button>
    </form>
    <footer>Desenvolvido por <b>Ícaro Souza</b> · <b>IsDevWorks</b><br>© <span id="yr">2026</span> Todos os direitos
        reservados</footer>
    <script>
        document.getElementById("yr").textContent = new Date().getFullYear();
        fetch("/api/me").then(r => { if (r.ok) location.replace("/") }).catch(() => { });
        document.getElementById("f").addEventListener("submit", async ev => {
            ev.preventDefault(); const b = document.getElementById("b"), e = document.getElementById("e"); b.disabled = true; e.textContent = "";
            try {
                const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ usuario: document.getElementById("u").value, senha: document.getElementById("s").value }) });
                const d = await r.json().catch(() => ({})); if (r.ok) location.replace("/"); else { e.textContent = d.erro || "Não foi possível entrar."; b.disabled = false }
            }
            catch (x) { e.textContent = "Sem conexão com o servidor."; b.disabled = false }
        });
    </script>
</body>

</html>
